app = "asana-harvest-dashboard"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DB_PATH = "/data/dashboard.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "dashboard_data"
  destination = "/data"
