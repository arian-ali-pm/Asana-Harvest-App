services:
  - type: web
    name: asana-harvest-dashboard
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn asanaharvestdashboard:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5

      # Set this to your Render service URL once deployed (e.g. https://asana-harvest-dashboard.onrender.com)
      # Used for Google OAuth redirect_uri.
      - key: APP_BASE_URL
        sync: false

      # Comma-separated allowlist of email domains. e.g. prosperitymedia.com.au
      # Anyone signing in with Google must have an email at one of these domains.
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false

      # Postgres connection string from Supabase.
      # Project Settings > Database > Connection string > URI (use the "Transaction" pooler URL).
      - key: DATABASE_URL
        sync: false

      # Google OAuth credentials from Google Cloud Console.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # Auto-generated by Render. Used to sign session cookies.
      - key: SESSION_SECRET
        generateValue: true

      # Auto-generated by Render. Used to encrypt Asana/Harvest tokens at rest.
      # Must be a urlsafe base64-encoded 32-byte key. Render will generate one for us.
      - key: FERNET_KEY
        generateValue: true
